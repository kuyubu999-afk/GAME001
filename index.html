<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827"><title>街头霓虹挑战</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f4f7ff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}
main{max-width:620px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:22px;margin:6px 0}.stats{display:flex;gap:8px}.stat{background:#202d40;padding:8px 12px;border-radius:12px;font-size:14px}
canvas{display:block;width:100%;height:min(67vh,680px);background:#18283a;border:1px solid #34445c;border-radius:18px;margin-top:12px;touch-action:none}
.controls{display:flex;gap:10px;margin-top:12px}.controls button{flex:1;padding:14px 8px;border:0;border-radius:12px;background:#2b8a78;color:white;font-weight:700;font-size:16px}
#start{background:#e0a83b;color:#18202c}.hint{color:#b7c4d5;font-size:13px;line-height:1.5}
.overlay{position:fixed;inset:0;background:#08111ddd;display:grid;place-items:center;padding:24px}.panel{max-width:420px;background:#202d40;border:1px solid #46566d;border-radius:20px;padding:24px;text-align:center}.panel button{padding:12px 28px;border:0;border-radius:12px;background:#e0a83b;font-weight:800;font-size:16px}
</style></head>
<body><main>
<div class="top"><h1>🌆 街头霓虹挑战</h1><div class="stats"><div class="stat">得分 <b id="score">0</b></div><div class="stat">时间 <b id="time">45</b>s</div><div class="stat">关卡 <b id="level">1</b></div></div></div>
<canvas id="game" aria-label="霓虹目标点击游戏"></canvas>
<div class="controls"><button id="start">开始挑战</button><button id="pause">暂停</button><button id="sound">音效：开</button></div>
<p class="hint">点击画面中出现的霓虹圆点得分。金色目标分数更高；避开灰色干扰点。45 秒一局，连击可获得额外奖励。</p>
</main>
<div class="overlay" id="intro"><div class="panel"><h2>街头霓虹挑战</h2><p>在城市街区中寻找霓虹目标，挑战你的反应速度与连击记录！</p><p>没有武器，没有现实攻击场景，只有街机式点击挑战。</p><button id="play">进入游戏</button></div></div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0,score=0,left=45,level=1,combo=0,running=false,paused=false,sound=true,last=0,spawn=0,targets=[],best=0;
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(c);
function tone(f=560){if(!sound)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.stop(a.currentTime+.13)}catch(e){}}
function add(){const gold=Math.random()<.16,bad=!gold&&Math.random()<.18;targets.push({x:24+Math.random()*(W-48),y:70+Math.random()*(H-120),r:gold?19:bad?17:15,life:2.5+Math.random()*1.3,type:gold?'gold':bad?'bad':'normal',pulse:Math.random()*6})}
function hud(){$('score').textContent=score;$('time').textContent=Math.ceil(left);$('level').textContent=level}
function start(){score=0;left=45;level=1;combo=0;targets=[];spawn=0;running=true;paused=false;$('intro').style.display='none';hud();last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;best=Math.max(best,score);$('intro').style.display='grid';$('intro').querySelector('h2').textContent='挑战结束！';$('intro').querySelector('p').textContent='本局得分：'+score+' · 连击挑战再来一次吧！';$('play').textContent='再玩一局'}
function draw(t){ctx.clearRect(0,0,W,H);const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#18283a');grad.addColorStop(1,'#26394b');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#172436';for(let i=0;i<8;i++){let x=i*W/7;let bh=90+(i*37%100);ctx.fillRect(x,H-bh-35,W/10,bh);ctx.fillStyle='#496076';for(let j=0;j<4;j++)ctx.fillRect(x+8+j*9,H-bh+12,W>400?4:3,5);ctx.fillStyle='#172436'}
ctx.fillStyle='#33465a';ctx.fillRect(0,H-35,W,35);
for(const a of targets){const p=1+Math.sin(t/170+a.pulse)*.09;ctx.beginPath();ctx.arc(a.x,a.y,a.r*p+7,0,Math.PI*2);ctx.fillStyle=a.type==='gold'?'#f2c45a33':a.type==='bad'?'#9aa6b333':'#43e0c333';ctx.fill();ctx.beginPath();ctx.arc(a.x,a.y,a.r*p,0,Math.PI*2);ctx.fillStyle=a.type==='gold'?'#f5c451':a.type==='bad'?'#8592a3':'#45ddc4';ctx.fill();ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.stroke()}
}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.05);last=now;if(!paused){left-=dt;spawn-=dt;level=1+Math.floor(score/100);if(spawn<=0){add();spawn=Math.max(.32,1.0-level*.07)}targets.forEach(a=>a.life-=dt);targets=targets.filter(a=>a.life>0);if(left<=0){left=0;hud();draw(now);end();return}hud()}draw(now);requestAnimationFrame(loop)}
function hit(e){if(!running||paused)return;const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let idx=-1;for(let i=targets.length-1;i>=0;i--){const a=targets[i];if(Math.hypot(a.x-x,a.y-y)<a.r+12){idx=i;break}}if(idx<0){combo=0;return}const a=targets.splice(idx,1)[0];if(a.type==='bad'){score=Math.max(0,score-15);combo=0;tone(170)}else{combo++;score+= (a.type==='gold'?25:10)+Math.min(combo,10)*2;tone(a.type==='gold'?900:620)}hud()}
c.addEventListener('pointerdown',hit);
$('start').onclick=start;$('play').onclick=start;$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'继续':'暂停';if(!paused){last=performance.now();requestAnimationFrame(loop)}};
$('sound').onclick=()=>{sound=!sound;$('sound').textContent='音效：'+(sound?'开':'关')};
document.addEventListener('keydown',e=>{if(e.key===' '&&running){paused=!paused;if(!paused){last=performance.now();requestAnimationFrame(loop)}}});
resize();draw(0);
})();
</script></body></html>
